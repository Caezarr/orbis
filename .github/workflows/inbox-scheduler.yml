name: Inbox scheduler

# Vercel Hobby only runs daily crons, so the 5-minute inbox pass is triggered
# from here. Daily jobs (retention, digest) stay in vercel.json.
# Needs repository secret CRON_SECRET (same value as in Vercel) and
# repository variable ORBIS_APP_URL (public origin, no trailing slash).
# Does nothing until both are set.
#
# GitHub does not honour "*/5" on this repository: from 15/11 to 24/11 the
# schedule fired every 3 to 9 hours. The app therefore shows the time of the
# last real check and says when it is late (src/lib/inbox/cadence.ts) instead
# of promising the configured interval. A 5-minute cadence needs Vercel Pro or
# a dedicated external scheduler.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: inbox-scheduler
  cancel-in-progress: false

permissions: {}

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger one inbox dispatcher pass
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ORBIS_APP_URL: ${{ vars.ORBIS_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$ORBIS_APP_URL" ]; then
            echo "Scheduler not configured (CRON_SECRET / ORBIS_APP_URL missing), skipping."
            exit 0
          fi
          # This repository is public, and so are its Actions logs: print the
          # HTTP status only, never the response body (activity counts, error
          # counts). Details go to the server logs and Sentry.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$ORBIS_APP_URL/api/cron/inbox" 2>/dev/null || true)
          echo "Inbox pass: HTTP ${status:-none}"
          test "$status" = "200"
